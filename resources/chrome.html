<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>侧边栏浏览器</title>
    <link rel="stylesheet" href="/__dsh_picker__/chrome.css" />
  </head>
  <body>
    <header class="bar">
      <div class="row">
        <div class="nav">
          <button id="back" class="icon" type="button" title="后退" aria-label="后退">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="forward" class="icon" type="button" title="前进" aria-label="前进">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="reload" class="icon" type="button" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <form id="go" class="address">
          <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="输入网址，例如 localhost:3000/admin" />
        </form>
        <button id="open" class="icon" type="button" title="在新标签页打开" aria-label="在新标签页打开">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="saveLogin" class="icon" type="button" title="保存这个网站的账号密码" aria-label="保存账号密码">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.4" cy="10.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.3 8.7 12.6 3.4M10.9 5.1l1.5 1.5M12.4 3.6l1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button id="pick" class="pick" type="button" title="开启元素拾取（也可在页面内按 ` 键）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13M8 1.5 6.4 3.4M8 1.5l1.6 1.9M8 14.5l-1.6-1.9M8 14.5l1.6-1.9M1.5 8l1.9-1.6M1.5 8l1.9 1.6M14.5 8l-1.9-1.6M14.5 8l-1.9 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>拾取</span>
        </button>
      </div>
      <div class="row tools">
        <div class="view">
          <button id="zoomOut" class="icon" type="button" title="缩小" aria-label="缩小">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <select id="zoom" class="select compact" title="页面缩放" aria-label="页面缩放"></select>
          <button id="zoomIn" class="icon" type="button" title="放大" aria-label="放大">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4v8M4 8h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button id="fitWidth" class="icon" type="button" title="适应宽度" aria-label="适应宽度">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5v5M14 5.5v5M4.5 8h7M4.5 8l1.6-1.6M4.5 8l1.6 1.6M11.5 8l-1.6-1.6M11.5 8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="device">
          <select id="device" class="select" title="设备预览（响应式 / 手机 / 平板）" aria-label="设备预览"></select>
          <button id="rotate" class="icon" type="button" title="横竖屏切换" aria-label="横竖屏切换">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="4" width="7" height="11" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="10.5" y="2" width="3.4" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <span id="size" class="size" title="当前视口尺寸（页面按此宽度应用媒体查询）"></span>
        </div>
      </div>
    </header>

    <div id="stage" class="stage">
      <div id="canvas" class="canvas">
        <div id="sizer" class="sizer">
          <div id="viewport" class="viewport">
            <iframe id="site" name="site" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <div id="overlay" class="overlay" hidden>
              <div id="box" class="box"></div>
              <div id="tag" class="tag"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="toast" class="toast" hidden></div>
      <div id="blank" class="blank">
        <p class="blank-title">侧边栏浏览器</p>
        <p class="blank-body">在上方输入网址后回车，页面会显示在这里；点「拾取」后在页面上点击任意元素，即可把它作为 <code>[标签][DOMn]</code> 引用加入对话。</p>
      </div>
    </div>

    <footer class="status">
      <span id="hint" class="hint">就绪</span>
      <span id="target" class="target"></span>
    </footer>

    <script src="/__dsh_picker__/chrome.js"></script>
  </body>
</html>
